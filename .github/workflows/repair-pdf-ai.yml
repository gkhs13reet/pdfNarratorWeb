name: Restore PDF upload and add AI translator

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix: restore PDF upload and add AI translator') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch application
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Correct GitHub link.
          s = s.replace('https://github.com/YOUR-USERNAME/YOUR-REPOSITORY', 'https://github.com/gkhs13reet/pdfNarratorWeb')

          # Add AI Translator button beside Open PDF.
          anchor = '''            <label for="pdfUpload" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium cursor-pointer flex items-center gap-2 transition-all">'''
          if 'id="btnTranslate"' not in s:
              translator_button = '''            <button id="btnTranslate" type="button" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-all">
                <i data-lucide="languages"></i>
                <span>AI Translate</span>
            </button>

'''
              if anchor not in s:
                  raise SystemExit('Open PDF button anchor not found')
              s = s.replace(anchor, translator_button + anchor, 1)

          # Add translator modal before Application Script.
          modal_marker = '    <!-- Application Script -->'
          if 'id="translatorModal"' not in s:
              modal = '''    <!-- AI Translator Modal -->
    <div id="translatorModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-xl w-full max-w-2xl p-5 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold">AI Translator</h2>
                <button id="btnCloseTranslator" type="button" class="text-gray-400 hover:text-white text-xl">×</button>
            </div>
            <div class="grid gap-3">
                <label class="text-sm text-gray-300">Translate current chapter to</label>
                <select id="translateLanguage" class="bg-gray-800 border border-gray-700 rounded-lg p-2 text-gray-200">
                    <option>Hindi</option><option>Punjabi</option><option>English</option><option>Spanish</option><option>French</option><option>German</option>
                </select>
                <button id="btnRunTranslate" type="button" class="bg-purple-600 hover:bg-purple-500 rounded-lg py-2 font-medium">Translate with Gemini AI</button>
                <div id="translateStatus" class="text-sm text-gray-400"></div>
                <textarea id="translateOutput" class="w-full min-h-64 bg-gray-950 border border-gray-700 rounded-lg p-3 text-gray-200" placeholder="Translation will appear here..."></textarea>
            </div>
        </div>
    </div>

'''
              if modal_marker not in s:
                  raise SystemExit('Application Script marker not found')
              s = s.replace(modal_marker, modal + modal_marker, 1)

          # Add selector entries.
          selector_marker = "            voiceSelect: document.getElementById('voiceSelect')"
          selector_new = "            voiceSelect: document.getElementById('voiceSelect'),\n            btnTranslate: document.getElementById('btnTranslate'),\n            translatorModal: document.getElementById('translatorModal'),\n            btnCloseTranslator: document.getElementById('btnCloseTranslator'),\n            translateLanguage: document.getElementById('translateLanguage'),\n            btnRunTranslate: document.getElementById('btnRunTranslate'),\n            translateStatus: document.getElementById('translateStatus'),\n            translateOutput: document.getElementById('translateOutput')"
          if selector_marker in s and "btnTranslate: document.getElementById('btnTranslate')" not in s:
              s = s.replace(selector_marker, selector_new, 1)

          # Add reliable helper functions immediately before File Upload Handler.
          handler_marker = '        // File Upload Handler'
          if handler_marker not in s:
              raise SystemExit('File Upload Handler marker not found')
          if 'function resetState()' not in s:
              helpers = r'''        function resetState() {
            window.speechSynthesis.cancel();
            STATE.pdfDoc = null;
            STATE.chapters = [];
            STATE.currentChapterIndex = 0;
            STATE.isPlaying = false;
            STATE.utterance = null;
            STATE.textChunks = [];
            STATE.currentChunkIndex = 0;
            SELECTORS.chapterList.innerHTML = '<div class="text-center text-sm text-gray-500 py-8">Upload a PDF to view chapters</div>';
            SELECTORS.chapterCount.innerText = '0';
            SELECTORS.textContainer.innerText = 'Select or upload a PDF to begin reading and listening.';
            SELECTORS.currentChapterTitle.innerText = 'No PDF Loaded';
            SELECTORS.playerTitle.innerText = 'No track active';
            SELECTORS.currentPageNum.innerText = '-';
            updatePlayBtn();
        }

        function showLoading(show, message = 'Processing...') {
            SELECTORS.loadingText.innerText = message;
            SELECTORS.loadingOverlay.classList.toggle('hidden', !show);
        }

        function highlightActiveChapter(index) {
            SELECTORS.chapterList.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active-chapter', i === index));
        }

        // File Upload Handler
'''
              s = s.replace(handler_marker, helpers, 1)

          # Replace upload handler with robust FileReader-compatible implementation.
          start = s.find('        // File Upload Handler')
          end = s.find('\n        async function parseOutline', start)
          if start == -1 or end == -1:
              raise SystemExit('Upload handler boundaries not found')
          handler = r'''        // File Upload Handler
        SELECTORS.pdfUpload.addEventListener('change', async (e) => {
            const input = e.target;
            const file = input.files && input.files[0];
            if (!file) return;
            input.value = '';

            const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
            if (!isPdf) {
                alert('Please select a PDF file.');
                return;
            }

            resetState();
            showLoading(true, 'Loading PDF file...');
            try {
                const buffer = await new Promise((resolve, reject) => {
                    if (typeof file.arrayBuffer === 'function') {
                        file.arrayBuffer().then(resolve).catch(reject);
                    } else {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = () => reject(reader.error || new Error('Could not read PDF file'));
                        reader.readAsArrayBuffer(file);
                    }
                });

                if (!buffer || !buffer.byteLength) throw new Error('The PDF file is empty or could not be read.');
                STATE.pdfDoc = await pdfjsLib.getDocument({ data: new Uint8Array(buffer) }).promise;
                showLoading(true, 'Reading PDF chapters...');
                const outline = await STATE.pdfDoc.getOutline();
                STATE.chapters = outline && outline.length ? await parseOutline(outline, STATE.pdfDoc.numPages) : generateFallbackChapters(STATE.pdfDoc.numPages);
                renderChapterList();
                if (STATE.chapters.length) await loadChapter(0);
            } catch (err) {
                console.error('PDF Processing Error:', err);
                SELECTORS.textContainer.innerText = 'Failed to load PDF: ' + (err.message || err);
                alert('PDF upload failed: ' + (err.message || err));
            } finally {
                showLoading(false);
            }
        });
'''
          s = s[:start] + handler + s[end:]

          # Add translator logic before parseOutline.
          translator_marker = '        async function parseOutline'
          if 'async function translateCurrentChapter' not in s:
              code = r'''        async function translateCurrentChapter() {
            if (!STATE.pdfDoc || !STATE.textChunks.length) {
                alert('Please upload a PDF and open a chapter first.');
                return;
            }

            let apiKey = localStorage.getItem('pdfNarratorGeminiKey') || '';
            if (!apiKey) {
                apiKey = prompt('Enter your Gemini API key (stored only in this browser):');
                if (!apiKey) return;
                localStorage.setItem('pdfNarratorGeminiKey', apiKey.trim());
            }

            const target = SELECTORS.translateLanguage.value;
            const text = SELECTORS.textContainer.innerText.trim();
            if (!text) return;

            SELECTORS.translateStatus.innerText = 'Translating...';
            SELECTORS.translateOutput.value = '';
            try {
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'x-goog-api-key': apiKey},
                    body: JSON.stringify({contents: [{parts: [{text: `Translate the following PDF text into ${target}. Preserve the meaning and formatting. Do not add commentary.\n\n${text}`}]}]})
                });
                const data = await response.json();
                if (!response.ok || data.error) throw new Error(data?.error?.message || `HTTP ${response.status}`);
                const translated = data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('').trim();
                if (!translated) throw new Error('Gemini returned no translation.');
                SELECTORS.translateOutput.value = translated;
                SELECTORS.translateStatus.innerText = `Translated to ${target}`;
            } catch (err) {
                console.error('Translation Error:', err);
                SELECTORS.translateStatus.innerText = 'Translation failed.';
                alert('AI translation failed: ' + (err.message || err));
            }
        }

'''
              if translator_marker not in s:
                  raise SystemExit('parseOutline marker not found')
              s = s.replace(translator_marker, code + translator_marker, 1)

          # Wire translator buttons after selectors are initialized.
          wire_marker = '        // Initialize Lucide icons'
          if "SELECTORS.btnTranslate.onclick" not in s:
              wire = '''        SELECTORS.btnTranslate.onclick = () => {
            SELECTORS.translatorModal.classList.remove('hidden');
            SELECTORS.translatorModal.classList.add('flex');
        };
        SELECTORS.btnCloseTranslator.onclick = () => {
            SELECTORS.translatorModal.classList.add('hidden');
            SELECTORS.translatorModal.classList.remove('flex');
        };
        SELECTORS.btnRunTranslate.onclick = translateCurrentChapter;

'''
              s = s.replace(wire_marker, wire + wire_marker, 1)

          # Accept .pdf as well as MIME type.
          s = s.replace('accept="application/pdf"', 'accept=".pdf,application/pdf"')
          p.write_text(s, encoding='utf-8')
          print('PDF upload and AI translator patched')

      - name: Verify
        run: |
          grep -q "function resetState" index.html
          grep -q "FileReader" index.html
          grep -q "btnTranslate" index.html
          grep -q "gemini-2.5-flash" index.html
          grep -q "x-goog-api-key" index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: restore PDF upload and add AI translator"
          git push
