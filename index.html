<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Narrator & AI Translator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
body{font-family:Arial,sans-serif}.drop{border:2px dashed #4b5563}.drop.drag{border-color:#3b82f6;background:#111827}.chapter.active{background:#1e3a5f}
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
<header class="bg-gray-900 border-b border-gray-800 p-4 flex flex-wrap gap-3 items-center justify-between">
<h1 class="text-xl font-bold">📖 PDF Narrator & AI Translator</h1>
<div class="flex gap-2">
<button id="openBtn" type="button" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg">📄 Open PDF</button>
<button id="translateBtn" type="button" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg">🌐 AI Translate</button>
<input id="pdfInput" type="file" accept=".pdf,application/pdf" style="display:none">
</div>
</header>

<main class="max-w-7xl mx-auto p-4 grid md:grid-cols-[280px_1fr] gap-4">
<aside class="bg-gray-900 rounded-xl p-3">
<h2 class="font-bold mb-3">Chapters <span id="count" class="text-gray-400">0</span></h2>
<div id="chapters" class="space-y-1 max-h-[70vh] overflow-auto"></div>
</aside>

<section class="bg-gray-900 rounded-xl p-4 min-h-[70vh]">
<div id="dropZone" class="drop rounded-xl p-8 text-center mb-4 cursor-pointer">
<div class="text-5xl mb-3">📄</div>
<h2 class="text-xl font-bold">Upload a PDF file</h2>
<p class="text-gray-400 mt-2">Click here or click <b>Open PDF</b>, or drag and drop a PDF.</p>
<p id="fileName" class="text-blue-400 mt-3"></p>
</div>
<div id="status" class="text-sm text-gray-400 mb-3">No PDF loaded.</div>
<h2 id="chapterTitle" class="text-xl font-bold mb-3">No PDF Loaded</h2>
<div id="text" class="whitespace-pre-wrap leading-7 text-gray-300">Select a PDF to begin reading.</div>
<div class="mt-6 flex gap-2">
<button id="prev" class="bg-gray-800 px-4 py-2 rounded-lg">← Previous</button>
<button id="play" class="bg-blue-600 px-4 py-2 rounded-lg">▶ Play</button>
<button id="next" class="bg-gray-800 px-4 py-2 rounded-lg">Next →</button>
</div>
</section>
</main>

<div id="translator" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
<div class="bg-gray-900 rounded-xl p-5 w-full max-w-3xl">
<div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold">🌐 AI Translator</h2><button id="closeTranslator" class="text-2xl">×</button></div>
<label class="block text-sm text-gray-400 mb-1">Translate to</label>
<select id="language" class="w-full bg-gray-800 rounded-lg p-2 mb-3"><option>Hindi</option><option>Punjabi</option><option>English</option><option>Spanish</option><option>French</option><option>German</option></select>
<button id="runTranslate" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg w-full">Translate with Gemini AI</button>
<p id="translateStatus" class="text-sm text-gray-400 mt-3"></p>
<textarea id="translation" class="w-full h-80 bg-gray-950 border border-gray-700 rounded-lg p-3 mt-3" placeholder="Translation will appear here..."></textarea>
</div>
</div>

<script>
const pdfjsLibReady = typeof pdfjsLib !== 'undefined';
if(pdfjsLibReady) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id);
const state={pdf:null,chapters:[],index:0,text:'',chunks:[],chunk:0,playing:false};

function status(msg){$('status').textContent=msg;}
function reset(){speechSynthesis.cancel();state.pdf=null;state.chapters=[];state.index=0;state.text='';state.chunks=[];state.chunk=0;state.playing=false;$('chapters').innerHTML='';$('count').textContent='0';$('text').textContent='Select a PDF to begin reading.';$('chapterTitle').textContent='No PDF Loaded';}

$('openBtn').addEventListener('click',()=>{ $('pdfInput').click(); });
$('dropZone').addEventListener('click',()=>{ $('pdfInput').click(); });
$('dropZone').addEventListener('dragover',e=>{e.preventDefault();$('dropZone').classList.add('drag');});
$('dropZone').addEventListener('dragleave',()=>$('dropZone').classList.remove('drag'));
$('dropZone').addEventListener('drop',e=>{e.preventDefault();$('dropZone').classList.remove('drag');const f=e.dataTransfer.files[0];if(f) loadPdf(f);});
$('pdfInput').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f) loadPdf(f);e.target.value='';});

async function readFile(file){
 if(file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name||'')) throw new Error('Please select a PDF file.');
 if(typeof file.arrayBuffer==='function') return new Uint8Array(await file.arrayBuffer());
 return new Uint8Array(await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('Could not read file'));r.readAsArrayBuffer(file);}));
}

async function loadPdf(file){
 reset();$('fileName').textContent=file.name;status('Reading PDF...');
 try{
  if(!pdfjsLibReady) throw new Error('PDF.js did not load. Refresh the page and try again.');
  const data=await readFile(file); if(!data.length) throw new Error('The PDF is empty.');
  state.pdf=await pdfjsLib.getDocument({data}).promise;status(`PDF loaded: ${state.pdf.numPages} pages. Reading chapters...`);
  let outline=[];try{outline=await state.pdf.getOutline()||[];}catch(e){console.warn(e);}
  state.chapters=[];
  for(let i=0;i<outline.length;i++){
   let page=0;try{let d=outline[i].dest;if(typeof d==='string')d=await state.pdf.getDestination(d);if(Array.isArray(d))page=await state.pdf.getPageIndex(d[0]);}catch(e){}
   state.chapters.push({title:outline[i].title||`Chapter ${i+1}`,start:page,end:state.pdf.numPages-1});
  }
  if(!state.chapters.length){for(let p=0;p<state.pdf.numPages;p+=5)state.chapters.push({title:`Pages ${p+1}-${Math.min(p+5,state.pdf.numPages)}`,start:p,end:Math.min(p+4,state.pdf.numPages-1)});}
  for(let i=0;i<state.chapters.length-1;i++)state.chapters[i].end=Math.max(state.chapters[i].start,state.chapters[i+1].start-1);
  renderChapters();await openChapter(0);status('PDF ready.');
 }catch(e){console.error(e);status('ERROR: '+e.message);$('text').textContent='Could not load this PDF. '+e.message;}
}

function renderChapters(){$('count').textContent=state.chapters.length;$('chapters').innerHTML='';state.chapters.forEach((c,i)=>{const b=document.createElement('button');b.className='chapter w-full text-left p-3 rounded-lg hover:bg-gray-800';b.textContent=c.title;b.onclick=()=>openChapter(i);$('chapters').appendChild(b);});highlight();}
function highlight(){[...$('chapters').children].forEach((b,i)=>b.classList.toggle('active',i===state.index));}
async function openChapter(i){if(!state.pdf||!state.chapters[i])return;state.index=i;highlight();const c=state.chapters[i];$('chapterTitle').textContent=c.title;status('Extracting text...');let out='';try{for(let p=c.start;p<=c.end;p++){const page=await state.pdf.getPage(p+1);const content=await page.getTextContent();out+=content.items.map(x=>x.str).join(' ')+'\n\n';}state.text=out.trim();$('text').textContent=state.text||'No extractable text found in this chapter.';state.chunks=state.text.match(/[^.!?]+[.!?]+/g)||[state.text];state.chunk=0;status(`Chapter ${i+1} of ${state.chapters.length}`);}catch(e){status('Text extraction error: '+e.message);}}
$('prev').onclick=()=>{if(state.index>0)openChapter(state.index-1)};$('next').onclick=()=>{if(state.index<state.chapters.length-1)openChapter(state.index+1)};
$('play').onclick=()=>{if(!state.chunks.length)return;if(state.playing){speechSynthesis.cancel();state.playing=false;$('play').textContent='▶ Play';return;}state.playing=true;$('play').textContent='⏸ Pause';speak();};
function speak(){if(!state.playing||state.chunk>=state.chunks.length){state.playing=false;$('play').textContent='▶ Play';return;}const u=new SpeechSynthesisUtterance(state.chunks[state.chunk++]);u.onend=speak;u.onerror=()=>{state.playing=false;$('play').textContent='▶ Play';};speechSynthesis.speak(u);}

$('translateBtn').onclick=()=>{$('translator').classList.remove('hidden');$('translator').classList.add('flex');};$('closeTranslator').onclick=()=>{$('translator').classList.add('hidden');$('translator').classList.remove('flex');};
$('runTranslate').onclick=async()=>{
 if(!state.text){$('translateStatus').textContent='Upload a PDF and open a chapter first.';return;}
 let key=localStorage.getItem('pdfNarratorGeminiKey')||prompt('Enter your Gemini API key. It will be stored only in this browser.');if(!key)return;key=key.trim();localStorage.setItem('pdfNarratorGeminiKey',key);
 const lang=$('language').value;$('translateStatus').textContent='Translating...';$('translation').value='';
 try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{text:`Translate the following text into ${lang}. Preserve the meaning. Return only the translation.\n\n${state.text}`}]}]})});const d=await r.json();if(!r.ok||d.error)throw new Error(d?.error?.message||`HTTP ${r.status}`);const out=d?.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('').trim();if(!out)throw new Error('Gemini returned no translation.');$('translation').value=out;$('translateStatus').textContent='Translation complete.';}catch(e){console.error(e);$('translateStatus').textContent='Translation failed: '+e.message;}}
</script>
</body>
</html>
