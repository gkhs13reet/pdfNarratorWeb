<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Chapter Audio Reader</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        .active-chapter {
            background-color: rgba(59, 130, 246, 0.15);
            border-left: 4px solid #3b82f6;
        }
    </style>
</head>

<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Top Bar -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-3">
            <button id="btnToggleSidebar" class="p-2 hover:bg-gray-800 rounded-lg md:hidden">
                <i data-lucide="menu"></i>
            </button>
            <h1 class="text-lg font-semibold flex items-center gap-2">
                <i data-lucide="book-open-check" class="text-blue-500"></i>
                <span id="currentChapterTitle">No PDF Loaded</span>
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <!-- GitHub Link Button -->
            <a href="https://github.com/YOUR-USERNAME/YOUR-REPOSITORY" target="_blank" rel="noopener noreferrer" 
               class="p-2 text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg transition-all flex items-center gap-2 text-sm border border-gray-800">
                <i data-lucide="github"></i>
                <span class="hidden sm:inline">GitHub</span>
            </a>

            <!-- Open PDF Button -->
            <label for="pdfUpload" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium cursor-pointer flex items-center gap-2 transition-all">
                <i data-lucide="upload"></i>
                <span>Open PDF</span>
                <input type="file" id="pdfUpload" accept="application/pdf" class="hidden">
            </label>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        <!-- Sidebar / Chapter List -->
        <aside id="sidebar" class="w-80 bg-gray-900 border-r border-gray-800 flex flex-col absolute md:relative inset-y-0 left-0 z-10 transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center">
                <span class="text-xs font-bold uppercase tracking-wider text-gray-400">Chapters (<span id="chapterCount">0</span>)</span>
                <button id="btnCloseSidebar" class="md:hidden text-gray-400 hover:text-white">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div id="chapterList" class="flex-1 overflow-y-auto p-2 space-y-1">
                <div class="text-center text-sm text-gray-500 py-8">Upload a PDF to view chapters</div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col overflow-hidden bg-gray-950 relative">
            <div class="flex-1 overflow-y-auto p-6 max-w-4xl mx-auto w-full">
                <div id="textContainer" class="prose prose-invert max-w-none text-gray-300 leading-relaxed space-y-4 whitespace-pre-wrap">
                    Select or upload a PDF to begin reading and listening.
                </div>
            </div>

            <!-- Loading Overlay -->
            <div id="loadingOverlay" class="absolute inset-0 bg-gray-950/80 backdrop-blur-sm flex flex-col items-center justify-center gap-3 z-30 hidden">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500"></div>
                <span id="loadingText" class="text-sm text-gray-300">Processing...</span>
            </div>
        </main>
    </div>

    <!-- Sticky Audio Player Bar -->
    <footer class="bg-gray-900 border-t border-gray-800 p-4 sticky bottom-0 z-20 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3 w-full md:w-auto">
            <div class="text-sm">
                <p id="playerTitle" class="font-medium text-gray-200 truncate max-w-xs">No track active</p>
                <p class="text-xs text-gray-500">Page <span id="currentPageNum">-</span></p>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center gap-4">
            <button id="btnPrevChapter" class="p-2 hover:bg-gray-800 text-gray-300 rounded-full">
                <i data-lucide="skip-back"></i>
            </button>
            <button id="btnPlay" class="p-3 bg-blue-600 hover:bg-blue-500 text-white rounded-full shadow-lg transition-transform active:scale-95">
                <i data-lucide="play"></i>
            </button>
            <button id="btnNextChapter" class="p-2 hover:bg-gray-800 text-gray-300 rounded-full">
                <i data-lucide="skip-forward"></i>
            </button>
        </div>

        <!-- Settings (Rate/Voice) -->
        <div class="flex items-center gap-3 w-full md:w-auto justify-end">
            <select id="rateSelect" class="bg-gray-800 border border-gray-700 text-xs rounded-lg p-2 text-gray-300 outline-none">
                <option value="0.75">0.75x</option>
                <option value="1" selected>1.0x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2.0x</option>
            </select>
            <select id="voiceSelect" class="bg-gray-800 border border-gray-700 text-xs rounded-lg p-2 text-gray-300 outline-none max-w-[150px] truncate">
                <option value="">Default Voice</option>
            </select>
        </div>
    </footer>

    <!-- Application Script -->
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const STATE = {
            pdfDoc: null,
            chapters: [],
            currentChapterIndex: 0,
            isPlaying: false,
            utterance: null,
            textChunks: [],
            currentChunkIndex: 0,
            speechRate: 1,
            selectedVoice: null
        };

        const SELECTORS = {
            pdfUpload: document.getElementById('pdfUpload'),
            sidebar: document.getElementById('sidebar'),
            btnToggleSidebar: document.getElementById('btnToggleSidebar'),
            btnCloseSidebar: document.getElementById('btnCloseSidebar'),
            chapterList: document.getElementById('chapterList'),
            chapterCount: document.getElementById('chapterCount'),
            textContainer: document.getElementById('textContainer'),
            currentChapterTitle: document.getElementById('currentChapterTitle'),
            playerTitle: document.getElementById('playerTitle'),
            currentPageNum: document.getElementById('currentPageNum'),
            btnPlay: document.getElementById('btnPlay'),
            btnPrevChapter: document.getElementById('btnPrevChapter'),
            btnNextChapter: document.getElementById('btnNextChapter'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            loadingText: document.getElementById('loadingText'),
            rateSelect: document.getElementById('rateSelect'),
            voiceSelect: document.getElementById('voiceSelect')
        };

        // Initialize Lucide icons
        lucide.createIcons();

        // Populate TTS Voices
        function populateVoices() {
            const voices = window.speechSynthesis.getVoices();
            SELECTORS.voiceSelect.innerHTML = '<option value="">Default Voice</option>';
            voices.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.name;
                opt.innerText = `${v.name} (${v.lang})`;
                SELECTORS.voiceSelect.appendChild(opt);
            });
        }
        populateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }

        // Sidebar Controls
        function toggleSidebar(show) {
            if (show) {
                SELECTORS.sidebar.classList.remove('-translate-x-full');
            } else {
                SELECTORS.sidebar.classList.add('-translate-x-full');
            }
        }
        SELECTORS.btnToggleSidebar.onclick = () => toggleSidebar(true);
        SELECTORS.btnCloseSidebar.onclick = () => toggleSidebar(false);

        // Event Handlers for Player
        SELECTORS.btnPlay.onclick = () => togglePlay();
        SELECTORS.btnPrevChapter.onclick = () => skipChapter(-1);
        SELECTORS.btnNextChapter.onclick = () => skipChapter(1);
        SELECTORS.rateSelect.onchange = (e) => {
            STATE.speechRate = parseFloat(e.target.value);
            if (STATE.isPlaying) {
                window.speechSynthesis.cancel();
                speakCurrentChunk();
            }
        };
        SELECTORS.voiceSelect.onchange = (e) => {
            const voices = window.speechSynthesis.getVoices();
            STATE.selectedVoice = voices.find(v => v.name === e.target.value) || null;
            if (STATE.isPlaying) {
                window.speechSynthesis.cancel();
                speakCurrentChunk();
            }
        };

        // File Upload Handler
        SELECTORS.pdfUpload.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            resetState();
            showLoading(true, "Loading PDF file...");

            try {
                const arrayBuffer = await file.arrayBuffer();
                STATE.pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

                showLoading(true, "Parsing outline...");
                const outline = await STATE.pdfDoc.getOutline();

                if (outline && outline.length > 0) {
                    STATE.chapters = await parseOutline(outline, STATE.pdfDoc.numPages);
                } else {
                    STATE.chapters = generateFallbackChapters(STATE.pdfDoc.numPages);
                }

                renderChapterList();
                if (STATE.chapters.length > 0) {
                    await loadChapter(0);
                }
            } catch (err) {
                console.error("PDF Processing Error:", err);
                SELECTORS.textContainer.innerText = "Failed to load PDF file.";
            } finally {
                showLoading(false);
            }
        };

        async function parseOutline(outline, totalPages) {
            const chapters = [];
            for (let i = 0; i < outline.length; i++) {
                const item = outline[i];
                let pageNum = 0;

                if (typeof item.dest === 'string') {
                    const dest = await STATE.pdfDoc.getDestination(item.dest);
                    if (dest) pageNum = await STATE.pdfDoc.getPageIndex(dest[0]);
                } else if (Array.isArray(item.dest)) {
                    pageNum = await STATE.pdfDoc.getPageIndex(item.dest[0]);
                }

                chapters.push({
                    title: item.title || `Section ${i + 1}`,
                    startPage: pageNum,
                    endPage: totalPages - 1
                });
            }

            for (let i = 0; i < chapters.length - 1; i++) {
                chapters[i].endPage = chapters[i + 1].startPage - 1;
            }
            return chapters;
        }

        function generateFallbackChapters(totalPages) {
            const chapters = [];
            const pagesPerChapter = 5;
            for (let i = 0; i < totalPages; i += pagesPerChapter) {
                const end = Math.min(i + pagesPerChapter - 1, totalPages - 1);
                chapters.push({
                    title: `Pages ${i + 1} - ${end + 1}`,
                    startPage: i,
                    endPage: end
                });
            }
            return chapters;
        }

        function chunkTextForSpeaking(text) {
            return text.match(/[^.!?]+[.!?]+/g) || [text];
        }

        function speakCurrentChunk() {
            if (!STATE.textChunks.length || STATE.currentChunkIndex >= STATE.textChunks.length) {
                STATE.isPlaying = false;
                updatePlayBtn();
                return;
            }

            const chunk = STATE.textChunks[STATE.currentChunkIndex];
            const utterance = new SpeechSynthesisUtterance(chunk);
            utterance.rate = STATE.speechRate;
            if (STATE.selectedVoice) utterance.voice = STATE.selectedVoice;

            utterance.onend = () => {
                if (STATE.isPlaying) {
                    STATE.currentChunkIndex++;
                    speakCurrentChunk();
                }
            };

            utterance.onerror = (e) => {
                console.error("TTS Error", e);
                STATE.isPlaying = false;
                updatePlayBtn();
            };

            STATE.utterance = utterance;
            window.speechSynthesis.speak(utterance);
        }

        function togglePlay() {
            if (!STATE.textChunks.length) return;

            if (STATE.isPlaying) {
                window.speechSynthesis.cancel();
                STATE.isPlaying = false;
            } else {
                STATE.isPlaying = true;
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                } else {
                    speakCurrentChunk();
                }
            }
            updatePlayBtn();
        }

        function updatePlayBtn() {
            const icon = SELECTORS.btnPlay.querySelector('i');
            if (STATE.isPlaying) {
                icon.setAttribute('data-lucide', 'pause');
            } else {
                icon.setAttribute('data-lucide', 'play');
            }
            lucide.createIcons();
        }

        async function loadChapter(index) {
            if (index < 0 || index >= STATE.chapters.length) return;

            window.speechSynthesis.cancel();
            STATE.isPlaying = false;
            updatePlayBtn();

            STATE.currentChapterIndex = index;
            const ch = STATE.chapters[index];

            SELECTORS.currentChapterTitle.innerText = ch.title;
            SELECTORS.playerTitle.innerText = ch.title;
            SELECTORS.currentPageNum.innerText = `${ch.startPage + 1} - ${ch.endPage + 1}`;

            highlightActiveChapter(index);

            showLoading(true, "Extracting text...");
            try {
                let fullText = "";
                for (let i = ch.startPage; i <= ch.endPage; i++) {
                    const page = await STATE.pdfDoc.getPage(i + 1);
                    const content = await page.getTextContent();
                    const text = content.items.map(s => s.str).join(' ');
                    fullText += text + "\n\n";
                }

                SELECTORS.textContainer.innerText = fullText.trim() || "No extractable text found in this chapter.";
                STATE.textChunks = chunkTextForSpeaking(fullText);
                STATE.currentChunkIndex = 0;
            } catch (err) {
                console.error("Error extracting text", err);
                SELECTORS.textContainer.innerText = "Error loading chapter text.";
            } finally {
                showLoading(false);
            }
        }

        function skipChapter(direction) {
            const newIndex = STATE.currentChapterIndex + direction;
            if (newIndex >= 0 && newIndex < STATE.chapters.length) {
                loadChapter(newIndex);
            }
        }

        function renderChapterList() {
            SELECTORS.chapterList.innerHTML = "";
            SELECTORS.chapterCount.innerText = STATE.chapters.length;

            STATE.chapters.forEach((ch, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3 rounded-lg text-sm transition-all flex flex-col gap-1 border-b border-gray-800/50 hover:bg-gray-800/50 cursor-pointer ${idx === 0 ? 'active-chapter' : ''}`;
                btn.innerHTML = `
                    <div class="font-medium text-gray-200 truncate">${ch.title}</div>
                    <div class="text-xs text-gray-500">Page ${ch.startPage + 1} - ${ch.endPage + 1}</div>
                `;
                btn.onclick = () => {
                    loadChapter(idx);
                    if (window.innerWidth < 768) toggleSidebar(false);
                };
                SELECTORS.chapterList.appendChild(btn);
            });
        }

        function highlightActiveChapter(index) {
            const children = SELECTORS.chapterList.children;
            for (let i = 0; i < children.length; i++) {
                if (i === index) {
                    children[i].classList.add('active-chapter');
                } else {
                    children[i].classList.remove('active-chapter');
                }
            }
        }

        function resetState() {
            window.speechSynthesis.cancel();
            STATE.pdfDoc = null;
            STATE.chapters = [];
            STATE.currentChapterIndex = 0;
            STATE.isPlaying = false;
            STATE.textChunks = [];
            STATE.currentChunkIndex = 0;
            updatePlayBtn();
        }

        function showLoading(show, text = "Loading...") {
            if (show) {
                SELECTORS.loadingText.innerText = text;
                SELECTORS.loadingOverlay.classList.remove('hidden');
            } else {
                SELECTORS.loadingOverlay.classList.add('hidden');
            }
        }
    </script>
</body>

</html>
